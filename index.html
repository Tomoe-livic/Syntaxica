<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Syntaxica</title>
<meta name="theme-color" content="#11131a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Syntaxica" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="titolo-riga">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#171a24"/><g fill="none" stroke="url(#lg)" stroke-linecap="round" stroke-linejoin="round"><path d="M150 178 L82 256 L150 334" stroke-width="38"/><path d="M362 178 L430 256 L362 334" stroke-width="38"/><path d="M300 204 C300 180 274 170 252 170 C224 170 208 186 208 206 C208 232 232 240 256 256 C280 272 304 280 304 306 C304 328 286 342 260 342 C234 342 214 330 210 304" stroke-width="36"/></g></svg>
    <h1>Syntax<span>ica</span></h1>
  </div>
  <input id="search" type="text" placeholder="Cerca per concetto, nome o parola chiave… es. “salvataggio”" autocomplete="off" />
  <div class="categorie">
    <button class="cat-btn" data-cat="HTML">HTML</button>
    <button class="cat-btn" data-cat="CSS">CSS</button>
    <button class="cat-btn" data-cat="JS">JS</button>
  </div>
</header>

<main>
  <div class="cronologia-wrap" id="cronologia-wrap"></div>
  <p class="hint" id="hint">Scrivi un concetto ("ciclo", "salvataggio", "centrare un elemento"...) oppure il nome esatto della sintassi.</p>
  <div class="count" id="count"></div>
  <div id="results"></div>
  <div id="brief-view" hidden></div>
  <div id="progetti-view" hidden></div>
</main>

<nav class="tabbar" aria-label="Sezioni">
  <button type="button" id="tab-cerca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Cerca</span></button>
  <button type="button" id="pref-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Preferiti</span></button>
  <button type="button" id="prog-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Progetti</span></button>
  <button type="button" id="brief-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Brief</span></button>
</nav>

<script src="data/html.js"></script>
<script src="data/css.js"></script>
<script src="data/js.js"></script>
<script src="data/esempi.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
